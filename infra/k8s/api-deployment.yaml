apiVersion: apps/v1
kind: Deployment
metadata:
  name: dhanshree-api-deployment
  namespace: dhanshree-prod
  labels:
    app: dhanshree-api
    tier: backend
spec:
  replicas: 4
  selector:
    matchLabels:
      app: dhanshree-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: dhanshree-api
    spec:
      containers:
        - name: api
          image: ghcr.io/dhanshree/api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: dhanshree-config
            - secretRef:
                name: dhanshree-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2048Mi"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: dhanshree-api-service
  namespace: dhanshree-prod
spec:
  selector:
    app: dhanshree-api
  ports:
    - protocol: TCP
      port: 4000
      targetPort: 4000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: dhanshree-api-hpa
  namespace: dhanshree-prod
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dhanshree-api-deployment
  minReplicas: 4
  maxReplicas: 24
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
