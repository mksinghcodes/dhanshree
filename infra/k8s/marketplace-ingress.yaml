apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dhanshree-global-ingress
  namespace: dhanshree-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, PUT, POST, DELETE, PATCH, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-credentials: "true"
spec:
  tls:
    - hosts:
        - api.dhanshree.global
        - nepal.dhanshree.global
        - india.dhanshree.global
        - uae.dhanshree.global
      secretName: dhanshree-tls-cert
  rules:
    # API Backend Cluster
    - host: api.dhanshree.global
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dhanshree-api-service
                port:
                  number: 4000

    # Nepal Storefront
    - host: nepal.dhanshree.global
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dhanshree-web-service
                port:
                  number: 3000

    # India Storefront
    - host: india.dhanshree.global
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dhanshree-web-service
                port:
                  number: 3000

    # UAE Storefront
    - host: uae.dhanshree.global
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dhanshree-web-service
                port:
                  number: 3000
