version: '3.8'

services:
  # -------------------------------------------------------------
  # Relational Database: PostgreSQL 16
  # -------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: dhanshree-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dhanshree_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dhanshree_secret_pw}
      POSTGRES_DB: ${POSTGRES_DB:-dhanshree_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dhanshree_user} -d ${POSTGRES_DB:-dhanshree_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # High-performance in-memory cache, session, BullMQ queue store
  # -------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dhanshree-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # -------------------------------------------------------------
  # Instant Search Engine: Meilisearch (Typo tolerance, multi-language)
  # -------------------------------------------------------------
  meilisearch:
    image: getmeili/meilisearch:v1.8
    container_name: dhanshree-search
    restart: always
    ports:
      - "7700:7700"
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey_Dhanshree_Secret_2026}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------------
  # S3 Compatible Media Storage (MinIO)
  # -------------------------------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: dhanshree-minio
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

  # -------------------------------------------------------------
  # Backend API (NestJS Modular Monolith)
  # -------------------------------------------------------------
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    container_name: dhanshree-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: development
      API_PORT: 4000
      DATABASE_URL: "postgresql://${POSTGRES_USER:-dhanshree_user}:${POSTGRES_PASSWORD:-dhanshree_secret_pw}@postgres:5432/${POSTGRES_DB:-dhanshree_db}?schema=public"
      REDIS_URL: "redis://redis:6379"
      MEILI_HTTP_ADDR: "http://meilisearch:7700"
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-masterKey_Dhanshree_Secret_2026}

  # -------------------------------------------------------------
  # Frontend Web Storefront (Next.js 14/15 App Router)
  # -------------------------------------------------------------
  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    container_name: dhanshree-web
    restart: always
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://api:4000

volumes:
  postgres_data:
  redis_data:
  meili_data:
  minio_data:
